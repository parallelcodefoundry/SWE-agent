tools:
  hpc_profile:
    signature: "hpc_profile <executable> <output_dir> [<app_args>...]"
    docstring: |
      Run HPCToolkit profiling workflow (hpcrun, hpcstruct, hpcprof) on an executable.

      This tool automatically executes the complete HPCToolkit profiling sequence:
      1. hpcrun: Profiles the application with GPU tracing enabled (-e gpu=nvidia -tt)
      2. hpcstruct: Recovers program structure from measurements
      3. hpcprof: Attributes measurements to source code

      The tool handles DCGM pause/resume and creates organized output directories.

      OUTPUT STRUCTURE:
        <output_dir>/
          measurements/   <- Raw profiling data (.hpcrun, .hpctrace files)
          database/       <- Processed database for analysis (contains meta.db)

      IMPORTANT: To analyze results with hatchet_analyze, use the DATABASE subdirectory:
        hatchet_analyze <output_dir>/database

      GPU control: The number of GPUs used is determined by your application's
      arguments/configuration or CUDA_VISIBLE_DEVICES, not by hpcrun itself.

      Example:
        hpc_profile ./myapp ./profile_output -s 30
        hatchet_analyze ./profile_output/database
    arguments:
      - name: executable
        type: string
        description: "Path to the executable to profile (can be relative or absolute)"
        required: true
      - name: output_dir
        type: string
        description: "Directory to store profiling results. Creates measurements/ and database/ subdirectories."
        required: true
      - name: app_args
        type: string
        description: "Optional arguments to pass to your application (e.g., '-s 30' for problem size)"
        required: false
