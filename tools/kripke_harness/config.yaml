execution_timeout: 600  # 10 minutes for build/run operations

tools:
  kripke_build:
    signature: "kripke_build [<arch>] [<clean>]"
    docstring: |
      Build the Kripke 3D Sn deterministic transport proxy application.

      IMPORTANT: The goal is to optimize GPU performance. Do NOT switch to a
      CPU-only build.

      This tool builds Kripke using CMake with RAJA for portability.
      Supports multiple backends for different architectures.

      Build configuration:
        - CMake with Release mode
        - MPI enabled
        - OpenMP enabled

      Backends:
        - Sequential: Single-threaded CPU
        - OpenMP: Multi-threaded CPU (default)
        - CUDA: NVIDIA GPU (preferred for optimization)
        - HIP: AMD GPU

      Returns build status and any compilation errors.
    arguments:
      - name: arch
        type: string
        description: "Backend architecture: Sequential, OpenMP, CUDA, HIP (default: OpenMP)"
        required: false
        argument_format: "--arch {{value}}"
      - name: clean
        type: boolean
        description: "Force clean rebuild (remove build directory)"
        required: false
        argument_format: "--clean"

  kripke_run:
    signature: "kripke_run [<arch>] [<layout>] [<zones>] [<groups>] [<niter>] [<np>] [<omp_threads>] [--baseline_only]"
    docstring: |
      Run Kripke with specified parameters using MPI.
      This tool checks BOTH performance AND correctness in a single run.

      IMPORTANT: This tool automatically runs BOTH the pristine (unmodified)
      and modified Kripke with IDENTICAL parameters, then:
        1. Runs a warmup (discarded) to stabilize GPU timing
        2. Compares TIMING to show speedup
        3. Verifies CORRECTNESS by comparing configuration values

      You do NOT need to call kripke_check_correct separately - this tool does both!

      Default configuration (use these for fair comparison):
        - Backend: OpenMP
        - Layout: DGZ
        - Zones: 32,32,32
        - Groups: 64
        - Iterations: 10
        - MPI ranks: 1
        - OpenMP threads: 8 per rank

      Data layouts (6 nestings):
        - DGZ, DZG, GDZ, GZD, ZDG, ZGD
        (D=Direction, G=Group, Z=Zone)

      The baseline is ALWAYS calculated with the SAME parameters you pass
      to ensure accurate speedup measurement and correctness verification.

      Returns: speedup comparison, correctness check, and timing details.
    arguments:
      - name: arch
        type: string
        description: "Backend: Sequential, OpenMP, CUDA, HIP (default: OpenMP)"
        required: false
        argument_format: "--arch {{value}}"
      - name: layout
        type: string
        description: "Data layout nesting (default: DGZ)"
        required: false
        argument_format: "--layout {{value}}"
      - name: zones
        type: string
        description: "Zone dimensions as x,y,z (default: 32,32,32)"
        required: false
        argument_format: "--zones {{value}}"
      - name: groups
        type: integer
        description: "Number of energy groups (default: 64)"
        required: false
        argument_format: "--groups {{value}}"
      - name: niter
        type: integer
        description: "Number of iterations (default: 10)"
        required: false
        argument_format: "--niter {{value}}"
      - name: np
        type: integer
        description: "Number of MPI ranks (default: 1)"
        required: false
        argument_format: "--np {{value}}"
      - name: omp_threads
        type: integer
        description: "OpenMP threads per rank (default: 8)"
        required: false
        argument_format: "--omp-threads {{value}}"
      - name: baseline_only
        type: boolean
        description: "Only run the baseline (pristine) version. Use this first to establish reference timing before making changes."
        required: false
        argument_format: "--baseline-only"

  kripke_parse_timing:
    signature: "kripke_parse_timing <output_file>"
    docstring: |
      Parse timing information from Kripke output.

      Extracts timer values from Kripke's output including:
        - LTimes: L-times moment calculation
        - LPlusTimes: L-plus-times calculation
        - Sweep: Sweep kernel time
        - Scattering: Scattering kernel time
        - Total solve time

      Returns JSON with timing breakdown and percentages.
    arguments:
      - name: output_file
        type: string
        description: "Path to Kripke output file"
        required: true
        argument_format: "{{value}}"

