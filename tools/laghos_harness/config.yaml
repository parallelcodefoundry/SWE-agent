execution_timeout: 600  # 10 minutes for build/run operations

tools:
  laghos_build:
    signature: "laghos_build [<clean>] [<setup>]"
    docstring: |
      Build the Laghos high-order Lagrangian hydrodynamics miniapp.

      Laghos requires MFEM, hypre, and METIS. These dependencies are
      built automatically if not present.

      IMPORTANT: The goal is to optimize GPU performance. Do NOT disable
      CUDA/GPU support.

      Build configuration:
        - Compiler: nvcc (CUDA) for A100 GPUs (sm_80)
        - Dependencies: MFEM (with CUDA), hypre, METIS
        - Device: CUDA GPU support with partial assembly

      Returns build status and any compilation errors.
    arguments:
      - name: clean
        type: boolean
        description: "Force clean rebuild (make clean first)"
        required: false
        argument_format: "--clean"
      - name: setup
        type: boolean
        description: "Rebuild dependencies even if they exist"
        required: false
        argument_format: "--setup"

  laghos_run:
    signature: "laghos_run [<problem>] [<dim>] [<rs>] [<tf>] [<device>] [<no_pa>] [<np>] [--baseline-only]"
    docstring: |
      Run Laghos benchmark and compare performance against baseline.

      Laghos solves compressible gas dynamics equations using high-order
      finite element methods on unstructured meshes. Runs on a single GPU
      by default (np=1).

      Test problems available:
        -p 0: Taylor-Green vortex (smooth)
        -p 1: Sedov blast wave (shock) [default]
        -p 3: Triple-point problem
        -p 4: Gresho vortex

      What it does:
        1. Runs a warmup (discarded) to stabilize GPU timing
        2. Runs the BASELINE (unmodified Laghos) with the parameters
        3. Runs YOUR MODIFIED version with the same parameters
        4. Compares energy values to verify CORRECTNESS
        5. Compares total runtime to measure SPEEDUP

      Output shows:
        - CORRECTNESS: PASSED/FAILED (Final energy |e| matches baseline)
        - BASELINE TIME: Runtime of unmodified version (seconds)
        - MODIFIED TIME: Runtime of your version (seconds)
        - RESULT: Speedup or slowdown factor

      Default parameters: problem=1 (Sedov), dim=2, rs=1, tf=0.4, np=1 (~24s per run)

      IMPORTANT: Always run laghos_build after code changes before running!
    arguments:
      - name: problem
        type: integer
        description: "Problem type (0=Taylor-Green, 1=Sedov, 3=Triple-point, 4=Gresho)"
        required: false
        argument_format: "-p {{value}}"
      - name: dim
        type: integer
        description: "Dimension (2 or 3)"
        required: false
        argument_format: "--dim {{value}}"
      - name: rs
        type: integer
        description: "Serial refinement level (default: 1)"
        required: false
        argument_format: "--rs {{value}}"
      - name: tf
        type: number
        description: "Final simulation time (default: 0.4)"
        required: false
        argument_format: "--tf {{value}}"
      - name: device
        type: string
        description: "Device type (cpu, cuda, hip)"
        required: false
        argument_format: "-d {{value}}"
      - name: no_pa
        type: boolean
        description: "Disable partial assembly (use full assembly)"
        required: false
        argument_format: "--no-pa"
      - name: np
        type: integer
        description: "Number of MPI ranks (default: 1)"
        required: false
        argument_format: "--np {{value}}"
      - name: baseline_only
        type: boolean
        description: "Only run the baseline (pristine) version. Use this first to establish reference timing before making changes."
        required: false
        argument_format: "--baseline-only"
