execution_timeout: 600  # 10 minutes for build/run operations

tools:
  qs_build:
    signature: "qs_build [<clean>]"
    docstring: |
      Build the Quicksilver Monte Carlo particle transport proxy application.

      IMPORTANT: The goal is to optimize GPU performance. Do NOT disable
      CUDA/GPU support in the Makefile.

      Build configuration:
        - Compiler: nvcc (CUDA) for A100 GPUs
        - Base flags: -O3 -std=c++11 -fopenmp -gencode=arch=compute_80,code=sm_80
        - Features: OpenMP, CUDA GPU support (no MPI)

      Makefile customization:
        You CAN add optimization flags to the Makefile and they will be respected:
        - CXXFLAGS: Add flags like -funroll-loops, -ffast-math, -ftree-vectorize
          (these are passed to the host compiler via -Xcompiler)
        - LDFLAGS: Add linker flags like -L, -l, -Wl,

      Returns build status and any compilation errors.
    arguments:
      - name: clean
        type: boolean
        description: "Force clean rebuild (make clean first)"
        required: false
        argument_format: "--clean"

  qs_run:
    signature: "qs_run [--baseline-only]"
    docstring: |
      Run Quicksilver benchmark and compare performance against baseline.

      This tool runs a standardized benchmark (Coral2_P2_1) that provides
      consistent, low-variance results for reliable performance measurement.

      What it does:
        1. Runs the BASELINE (unmodified Quicksilver) with the benchmark
        2. Runs YOUR MODIFIED version with the same benchmark
        3. Compares physics values to verify CORRECTNESS
        4. Compares total runtime to measure SPEEDUP

      Output shows:
        - CORRECTNESS: PASSED/FAILED (physics values match baseline)
        - BASELINE TIME: Runtime of unmodified version (seconds)
        - MODIFIED TIME: Runtime of your version (seconds)
        - RESULT: Speedup or slowdown factor

      NOTE: The benchmark takes ~50 seconds per run (~100 seconds total for both).
      TIP: Use --baseline-only on your first run to get baseline timing without running the modified version.

      IMPORTANT: Always run qs_build after code changes before running qs_run!
    arguments:
      - name: baseline_only
        type: boolean
        description: "Only run the baseline (pristine) version. Use this first to establish reference timing before making changes."
        required: false
        argument_format: "--baseline-only"

  qs_parse_timing:
    signature: "qs_parse_timing <output_file>"
    docstring: |
      Parse timing information from Quicksilver output.

      Extracts timer values from Quicksilver's output including:
        - cycleTracking_Kernel: Kernel time
        - cycleTracking: Total cycle tracking time
        - Total time

      Returns JSON with timing breakdown.
    arguments:
      - name: output_file
        type: string
        description: "Path to Quicksilver output file"
        required: true
        argument_format: "{{value}}"

