execution_timeout: 600  # 10 minutes for build/run operations

tools:
  lulesh_build:
    signature: "lulesh_build [<clean>] [<no_mpi>]"
    docstring: |
      Build the LULESH 2.0 CUDA shock hydrodynamics proxy application.

      IMPORTANT: The goal is to optimize GPU performance. Do NOT disable
      CUDA/GPU support.

      Build configuration:
        - Compiler: nvcc (CUDA) for A100 GPUs (sm_80)
        - Base flags: -O3 -std=c++11 -arch=sm_80
        - Features: CUDA GPU support, MPI (enabled by default for multi-GPU)

      MPI is enabled by default. Lulesh uses 8 MPI ranks (2x2x2 cube) on
      4 GPUs. Use --no-mpi to disable if needed.

      Returns build status and any compilation errors.
    arguments:
      - name: clean
        type: boolean
        description: "Force clean rebuild (make clean first)"
        required: false
        argument_format: "--clean"
      - name: no_mpi
        type: boolean
        description: "Disable MPI support (single GPU only)"
        required: false
        argument_format: "--no-mpi"

  lulesh_run:
    signature: "lulesh_run [<size>] [<iterations>] [<gpu>] [<np>] [--baseline-only]"
    docstring: |
      Run LULESH benchmark and compare performance against baseline.

      Runs with MPI across multiple GPUs (default: 8 ranks = 2x2x2 cube
      on 4 GPUs, 2 ranks per GPU). Lulesh requires a perfect cube number
      of MPI ranks (1, 8, 27, 64, ...).

      What it does:
        1. Runs the BASELINE (unmodified LULESH) with the parameters
        2. Runs YOUR MODIFIED version with the same parameters
        3. Compares energy values to verify CORRECTNESS
        4. Compares total runtime to measure SPEEDUP

      Output shows:
        - CORRECTNESS: PASSED/FAILED (Final Origin Energy matches baseline)
        - BASELINE TIME: Runtime of unmodified version (seconds)
        - MODIFIED TIME: Runtime of your version (seconds)
        - RESULT: Speedup or slowdown factor

      Default parameters: size=30, iterations=100, np=8

      IMPORTANT: Always run lulesh_build after code changes before running!
    arguments:
      - name: size
        type: integer
        description: "Problem size - elements per side (default: 30)"
        required: false
        argument_format: "-s {{value}}"
      - name: iterations
        type: integer
        description: "Number of iterations (default: 100)"
        required: false
        argument_format: "-i {{value}}"
      - name: gpu
        type: string
        description: "GPU device to use (default: all available)"
        required: false
        argument_format: "--gpu {{value}}"
      - name: np
        type: integer
        description: "Number of MPI ranks — must be a perfect cube (default: 8)"
        required: false
        argument_format: "--np {{value}}"
      - name: baseline_only
        type: boolean
        description: "Only run the baseline (pristine) version. Use this first to establish reference timing before making changes."
        required: false
        argument_format: "--baseline-only"

