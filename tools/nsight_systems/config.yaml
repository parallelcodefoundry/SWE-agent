tools:
  nsys_profile:
    signature: "nsys_profile <executable> <output_dir> [<app_args>...]"
    docstring: |
      System-wide GPU timeline profiling with NVIDIA Nsight Systems (nsys).

      Shows WHERE time is spent across CUDA kernels, memory transfers, and MPI calls.
      Use this tool FIRST to identify which kernels are hotspots, then use ncu_profile
      to deep-dive into specific kernels.

      OUTPUT STRUCTURE:
        <output_dir>/
          report.nsys-rep        <- Binary report (can be opened in Nsight Systems GUI)
          cuda_kern_summary.txt  <- Top GPU kernels ranked by total execution time
          cuda_api_summary.txt   <- CUDA API call summary (malloc, memcpy, launch)
          expert_analysis.txt    <- Expert rules: sync issues, pageable memory, GPU idle gaps
          summary.txt            <- Agent-friendly summary with all analysis combined

      The tool runs NVIDIA expert analysis rules that automatically detect:
        - Blocking synchronization APIs (cudaDeviceSynchronize, cudaStreamSynchronize)
        - Async memcpys that silently become synchronous due to pageable memory
        - Synchronous memcpy/memset calls that should be async
        - GPU idle gaps (>50ms of no GPU activity)
        - Time chunks with low GPU utilization (<80%)

      INTERPRETING RESULTS:
        - Kernel with highest total time = primary optimization target
        - Sync API findings = switch to CUDA streams and async operations
        - Pageable memory warnings = use cudaMallocHost for pinned memory
        - GPU gaps / low utilization = overlap compute with transfers
        - Many short kernels = consider kernel fusion

      Example:
        nsys_profile ./lulesh ./nsys_out
        nsys_profile ./lulesh ./nsys_out "-s 30"
    arguments:
      - name: executable
        type: string
        description: "Path to the CUDA executable to profile"
        required: true
      - name: output_dir
        type: string
        description: "Directory to store profiling results"
        required: true
      - name: app_args
        type: string
        description: "Optional arguments to pass to the application (e.g., '-s 30')"
        required: false
    execution_timeout: 600
