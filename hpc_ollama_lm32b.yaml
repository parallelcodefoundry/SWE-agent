# hpc_ollama_lm32b.yaml
# Configuration for SWE-bench/SWE-agent-LM-32B via local Ollama server
agent:
  model:
    name: ollama_chat/swe-agent-32b
    api_base: http://127.0.0.1:11435
    api_key: EMPTY
    per_instance_cost_limit: 0
    total_cost_limit: 0
    per_instance_call_limit: 100
  tools:
    parse_function:
      type: thought_action

env:
  deployment:
    type: docker
    container_runtime: podman
    pull: missing
    docker_args:
      - --ipc=host
      - --runtime=crun
  repo:
    path: /pscratch/sd/k/krydzy/test-repo

problem_statement:
  github_url: https://github.com/SWE-agent/test-repo/issues/1
