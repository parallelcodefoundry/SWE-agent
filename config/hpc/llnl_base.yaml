# Base YAML template for all LLNL proxy app configs (Kripke, Laghos, Lulesh, Quicksilver).
# Prompts are injected from prompt.py at runtime by SweAgentLauncher.
# Placeholders (SYSTEM_PROMPT, INSTANCE_PROMPT, EXECUTION_TIMEOUT,
# APP_ROOT_VAR, APP_ROOT_PATH, REPO_PATH, BUNDLES, RUN_CMD) are
# replaced dynamically by SweAgentLauncher.generate_config().

agent:
  templates:
    system_template: |-
      __SYSTEM_PROMPT__
    instance_template: |-
      __INSTANCE_PROMPT__
    next_step_template: |-
      OBSERVATION:
      {{observation}}
      (Open file: {{open_file}})
      (Current directory: {{working_dir}})
      bash-$
    next_step_no_output_template: |-
      Your command ran successfully and did not produce any output.
      (Open file: {{open_file}})
      (Current directory: {{working_dir}})
      bash-$
    demonstration_template: |
      Here is a demonstration of how to correctly accomplish this task.
      It is included to show you how to correctly use the interface.
      You do not need to follow exactly what is done in the demonstration.
      --- DEMONSTRATION ---
      {{demonstration}}
      --- END OF DEMONSTRATION ---
    demonstrations:
      - trajectories/demonstrations/str_replace_anthropic_demo.yaml
    put_demos_in_history: true
  model:
    api_base: "http://127.0.0.1:8008/v1"
    api_key: "dummy"
    name: openai/openai/gpt-oss-120b
    per_instance_cost_limit: 0
    per_instance_call_limit: 200
  tools:
    execution_timeout: __EXECUTION_TIMEOUT__
    total_execution_timeout: 3600
    tools_base_path: /tmp/sweagent
    env_variables:
      PAGER: cat
      MANPAGER: cat
      LESS: -R
      GIT_PAGER: cat
      CUDA_VISIBLE_DEVICES: "0,1,2,3"
      OMP_NUM_THREADS: 32
      __APP_ROOT_VAR__: __APP_ROOT_PATH__
      SWE_AGENT_ENV_FILE: /tmp/sweagent/.swe-agent-env
      SWE_AGENT_STATE_FILE: /tmp/sweagent/state.json
    bundles:
__BUNDLES__
    registry_variables:
      USE_FILEMAP: 'true'
      SUBMIT_REVIEW_MESSAGES:
        - |
          Before finalizing submission, verify:

          1. You ran __RUN_CMD__ AFTER your last changes (it checks BOTH performance AND correctness)
          2. The __RUN_CMD__ output showed "CORRECTNESS: PASSED"
          3. The __RUN_CMD__ output showed a speedup (FASTER result)
          4. Your changes are focused on the optimization task

          If you have already verified these after your last changes, call submit again to finalize.

          Changes to be submitted:
          <diff>
          {{diff}}
          </diff>
    enable_bash_tool: true
    parse_function:
      type: function_calling
  history_processors:
    - type: last_n_observations
      n: 5

env:
  repo:
    path: __REPO_PATH__
  deployment:
    type: local
