# Kripke optimization WITH profiling tools
# Run with: sweagent run --config config/hpc/kripke_with_profiling.yaml
#
# Prerequisites:
#   module load cuda/12.4 openmpi/5.0.7
#   source ~/spack/share/spack/setup-env.sh && spack load hpctoolkit

agent:
  templates:
    system_template: |-
      You are an autonomous agent that can interact with a computer to solve performance optimization tasks.

      CRITICAL ARCHITECTURE REQUIREMENT:
      - You are optimizing for NVIDIA A100 GPUs
      - The application is PRE-BUILT with CUDA for A100 GPUs. Run kripke_run --arch CUDA first to get a baseline measurement before making any changes.
      - You MUST use --arch CUDA for ALL kripke_build and kripke_run commands
      - Do NOT use --arch OpenMP or --arch Sequential - these are CPU backends and will not test GPU performance

      CRITICAL BUILD REQUIREMENT:
      - You MUST run kripke_build --arch CUDA after EVERY source code edit before testing
      - Source changes have NO effect until you rebuild
      - Do NOT skip rebuilding - your changes will not be applied otherwise
      - You CAN edit CMakeLists.txt to add compiler flags (e.g., -funroll-loops, -ffast-math, -O3). The build harness reads CMake settings. Focus primarily on source code (.cpp, .h files) but build flag tuning is allowed.
      - If the build fails, call kripke_build --clean --arch CUDA for a clean rebuild. Do NOT try to fix build issues manually.

      OPTIMIZATION SCOPE:
      - Explore the ENTIRE repository for optimization opportunities
      - Consider algorithmic improvements, data structure changes, memory layouts, etc.
      - Any valid performance optimization is welcome - not just GPU-specific changes
      - The key requirement is that you TEST with --arch CUDA to measure GPU performance

      SUBMISSION:
      When you have made improvements and verified correctness, call the submit command.
      Reasoning: high
    instance_template: |-
      <uploaded_files>
      {{working_dir}}
      </uploaded_files>

      TASK: Optimize the runtime performance of the Kripke 3D Sn deterministic transport application.

      The application is in {{working_dir}}.

      IMPORTANT: You are optimizing for NVIDIA A100 GPUs.
      You MUST use --arch CUDA for all builds and runs. Do NOT use OpenMP or Sequential.

      WORKFLOW:
      1. kripke_build --arch CUDA - Build the application for A100 GPUs
      2. kripke_run --arch CUDA - Run to measure current performance AND verify correctness
      3. hpc_profile / hatchet_analyze - Profile to identify hotspots
      4. Explore the repository to understand the codebase and identify optimization opportunities
      5. Edit source files to optimize performance
      6. kripke_build --arch CUDA - REBUILD (required after every edit!)
      7. kripke_run --arch CUDA - Measure improvement AND verify correctness
      8. submit - When done with improvements

      NOTE: kripke_run automatically checks BOTH timing AND correctness - no separate correctness check needed!

      PROFILING TOOLS AVAILABLE: hpc_profile, hpc_analyze, hatchet_analyze, compiler_analysis, gpu_info, cpu_info

      OPTIMIZATION SCOPE:
      - Explore the entire repository for optimization opportunities
      - PRIORITIZE source code changes over compiler flags:
        * Algorithmic improvements (reduce computational complexity)
        * Data structure optimizations (memory layout, cache efficiency)
        * Loop transformations (blocking, tiling, fusion)
        * Parallelization improvements (better work distribution)
      - Compiler flag changes are acceptable but should NOT be your only optimization
      - Key files: src/Kripke/Kernel/*.cpp, src/Kripke/Arch/*.h, but any file is fair game

      CRITICAL:
      - Always use --arch CUDA (not OpenMP!) for builds and runs
      - Always rebuild with kripke_build --arch CUDA after editing source files!
      - If a build fails, carefully analyze the error before making changes
      - Do NOT add flags like -fno-exceptions or -fno-rtti (breaks RAJA/CAMP)

      Thinking should be thorough.
    next_step_template: |-
      OBSERVATION:
      {{observation}}
      (Open file: {{open_file}})
      (Current directory: {{working_dir}})
      bash-$
    next_step_no_output_template: |-
      Your command ran successfully and did not produce any output.
      (Open file: {{open_file}})
      (Current directory: {{working_dir}})
      bash-$
    demonstration_template: |
      Here is a demonstration of how to correctly accomplish this task.
      It is included to show you how to correctly use the interface.
      You do not need to follow exactly what is done in the demonstration.
      --- DEMONSTRATION ---
      {{demonstration}}
      --- END OF DEMONSTRATION ---
    demonstrations:
      - trajectories/demonstrations/str_replace_anthropic_demo.yaml
    put_demos_in_history: true
  model:
    api_base: "http://127.0.0.1:8008/v1"
    api_key: "dummy"
    name: openai/openai/gpt-oss-120b
    per_instance_cost_limit: 0
    per_instance_call_limit: 200
  tools:
    execution_timeout: 900
    total_execution_timeout: 3600
    tools_base_path: /tmp/sweagent
    env_variables:
      PAGER: cat
      MANPAGER: cat
      LESS: -R
      GIT_PAGER: cat
      CUDA_VISIBLE_DEVICES: "0,1,2,3"
      OMP_NUM_THREADS: 32
      KRIPKE_ROOT: /pscratch/sd/k/krydzy/SWE-agent/Kripke_test
      SWE_AGENT_ENV_FILE: /tmp/sweagent/.swe-agent-env
      SWE_AGENT_STATE_FILE: /tmp/sweagent/state.json
    bundles:
      - path: tools/registry
      - path: tools/edit_anthropic
      - path: tools/kripke_harness
      - path: tools/hpctoolkit
      - path: tools/hatchet
      - path: tools/system_info
      - path: tools/profiling
      - path: tools/review_on_submit_m
      - path: tools/forfeit
    registry_variables:
      USE_FILEMAP: 'true'
      SUBMIT_REVIEW_MESSAGES:
        - |
          Before finalizing submission, verify:

          1. You ran kripke_run AFTER your last changes (it checks BOTH performance AND correctness)
          2. The kripke_run output showed "CORRECTNESS: PASSED"
          3. The kripke_run output showed a speedup (FASTER result)
          4. Your changes are focused on the optimization task

          If you have already verified these after your last changes, call submit again to finalize.

          Changes to be submitted:
          <diff>
          {{diff}}
          </diff>
    enable_bash_tool: true
    parse_function:
      type: function_calling
  history_processors:
    - type: last_n_observations
      n: 5

env:
  repo:
    path: /pscratch/sd/k/krydzy/SWE-agent/Kripke_test
  deployment:
    type: local
